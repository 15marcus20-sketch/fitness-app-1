<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#14161a">
  <meta name="description" content="ON TRACK - Precision Session Builder & Workout Tracker">
  
  <!-- Mobile & PWA Capabilities -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ON TRACK">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Icons -->
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <title>ON TRACK // Session Builder</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  
  <!-- Modular Stylesheets -->
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><span class="dot"></span>ON TRACK <small>// SESSION BUILDER</small></div>
    <button class="btn-install-pwa" id="pwaInstallBtn" style="display:none;" title="Install App to Home Screen">
      <span class="pwa-icon">⬇</span> INSTALL
    </button>
  </header>

  <main id="main">
    <div class="loading-wrap" id="loading">
      <div class="spinner"></div>
      <div>LOADING ON TRACK...</div>
    </div>
  </main>

  <nav class="tabbar" id="tabbar" style="display:none;">
    <div class="tab active" data-view="today"><span class="glyph">&#9673;</span>TODAY</div>
    <div class="tab" data-view="library"><span class="glyph">&#9776;</span>LIBRARY</div>
    <div class="tab" data-view="profiles"><span class="glyph">&#9881;</span>PROFILES</div>
    <div class="tab" data-view="history"><span class="glyph">&#9202;</span>LOG</div>
  </nav>
</div>

<div class="toast" id="toast"></div>

<div class="player-overlay" id="playerOverlay">
  <div class="player-top">
    <div class="player-progress" id="pStepLabel"></div>
    <div class="player-phase" id="pPhaseLabel"></div>
    <div class="player-name" id="pNameLabel"></div>
  </div>
  <div class="player-mid">
    <div class="player-illustration" id="pIllustration"></div>
    <div class="player-timer" id="pTimerLabel">--</div>
    <div class="player-setsreps" id="pSetsRepsLabel"></div>
    <div class="player-next" id="pNextLabel"></div>
  </div>
  <div class="player-bottom" id="pBottomControls"></div>
</div>

<!-- Modular Scripts -->
<script src="js/rig.js"></script>
<script src="js/exercises.js"></script>
<script src="js/storage.js"></script>
<script src="js/audio.js"></script>
<script src="js/app.js"></script>

<!-- Progressive Web App (Offline & Install Prompt) -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').then((reg) => {
        console.log('[ON TRACK] PWA Service Worker registered:', reg.scope);
      }).catch((err) => {
        console.warn('[ON TRACK] PWA Service Worker registration:', err);
      });
    });
  }

  let deferredInstallPrompt = null;
  const pwaInstallBtn = document.getElementById('pwaInstallBtn');

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    if (pwaInstallBtn) pwaInstallBtn.style.display = 'inline-flex';
  });

  if (pwaInstallBtn) {
    pwaInstallBtn.addEventListener('click', async () => {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      const choice = await deferredInstallPrompt.userChoice;
      if (choice && choice.outcome === 'accepted') {
        pwaInstallBtn.style.display = 'none';
      }
      deferredInstallPrompt = null;
    });
  }

  window.addEventListener('appinstalled', () => {
    if (pwaInstallBtn) pwaInstallBtn.style.display = 'none';
    console.log('[ON TRACK] PWA installed successfully');
  });
</script>
</body>
</html>
