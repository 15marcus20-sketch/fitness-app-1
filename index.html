<!-- Progressive Web App (Offline & Install Prompt) -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').then((reg) => {
        console.log('[ON TRACK] PWA Service Worker registered:', reg.scope);
      }).catch((err) => {
        console.warn('[ON TRACK] PWA Service Worker registration:', err);
      });
    });
  }

  let deferredInstallPrompt = null;

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    if (typeof onInstallAvailable === 'function') onInstallAvailable(true);
  });

  // Called by the "Keep it close" install sheet (js/app.js)
  async function triggerPwaInstall(){
    if (!deferredInstallPrompt) return false;
    deferredInstallPrompt.prompt();
    const choice = await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    if (typeof onInstallAvailable === 'function') onInstallAvailable(false);
    return !!(choice && choice.outcome === 'accepted');
  }

  window.addEventListener('appinstalled', () => {
    deferredInstallPrompt = null;
    if (typeof onInstallAvailable === 'function') onInstallAvailable(false);
    console.log('[ON TRACK] PWA installed successfully');
  });
</script>
</body>
